{% extends "base.html" %}

{% block contents %}

<div class="card p-3">

    {% if it.id %}

        <label class="label" for="title">タイトル：</label>
        <input
            id="title"
            name="title"
            type="text"
            value="{{ it.title }}"
            class="input"
        >

        <label class="label" for="body">本文：</label>
        <textarea
            id="body"
            name="body"
            class="textarea"
        >{{ it.body }}</textarea>

        <div class="mt-3">
            <button
                type="button"
                class="button is-primary"
                onclick="updateMemo({{ it.id }})"
            >
                更新
            </button>

            <button
                type="button"
                class="button is-danger"
                onclick="deleteMemo({{ it.id }})"
            >
                削除
            </button>
        </div>

    {% else %}

        <form method="POST" action="/memo">

            <label class="label" for="title">タイトル：</label>
            <input
                id="title"
                name="title"
                type="text"
                value="{{ it.title }}"
                class="input"
            >

            <label class="label" for="body">本文：</label>
            <textarea
                id="body"
                name="body"
                class="textarea"
            >{{ it.body }}</textarea>

            <button
                type="submit"
                class="button is-primary mt-3"
            >
                保存
            </button>

        </form>

    {% endif %}

</div>

<script>

async function updateMemo(id) {

    const title =
        document.getElementById("title").value;

    const body =
        document.getElementById("body").value;

    const response = await fetch(
        `/memo/${id}`,
        {
            method: "PATCH",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                title: title,
                body: body
            })
        }
    );

    if (response.ok) {
        alert("更新しました");
        window.location.href = "/";
    } else {
        const data = await response.json();
        alert(data.message);
    }
}


async function deleteMemo(id) {

    const result =
        confirm("このメモを削除しますか？");

    if (!result) {
        return;
    }

    const response = await fetch(
        `/memo/${id}`,
        {
            method: "DELETE"
        }
    );

    if (response.ok) {
        alert("削除しました");
        window.location.href = "/";
    } else {
        const data = await response.json();
        alert(data.message);
    }
}

</script>

{% endblock %}
