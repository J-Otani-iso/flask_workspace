{% extends "base.html" %}

{% block title %}
掲示板の書き込みページ
{% endblock %}

{% block header %}
掲示板の書き込みページ
{% endblock %}

{% block contents %}
<!-- メッセージ内容やユーザー名を送信するフォームを定義 -->
<form action="{{url_for('update', message_id = message.id)}}" method="POST">
    <p><textarea name="contents" rows="5" cols="60">{{message.contents}}</textarea></p>
    <input type="hidden" name="user_name" value="{{login_user_name}}">
    <input type="submit" value="更新">
</form>
{% endblock %}
